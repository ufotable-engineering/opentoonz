name: Upstream Sync

# Opens (or refreshes) a pull request that brings opentoonz/opentoonz master
# into integration. Nothing is merged automatically: conflicts and the revert
# of in-house changes that landed upstream are left to the reviewer.

on:
  schedule:
    - cron: '0 21 * * *'  # 06:00 JST
  workflow_dispatch:

permissions: {}

concurrency: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pushes and pull requests made with GITHUB_TOKEN do not start other
      # workflows, so the sync acts as an organization-owned GitHub App instead
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v6
        with:
          ref: integration
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/opentoonz/opentoonz.git
          git fetch upstream master

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/master origin/integration; then
            echo "No upstream commits missing from integration"
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror master
        if: steps.check.outputs.uptodate != 'true'
        run: git push origin upstream/master:refs/heads/master

      # A reviewer may have merged integration into sync/upstream to resolve
      # conflicts, so the branch is advanced rather than reset. If that merge
      # conflicts again the branch is left as is and the PR body says so; the
      # pull request itself cannot show a conflict against upstream
      - name: Update sync branch
        id: sync
        if: steps.check.outputs.uptodate != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          conflict=false
          if git ls-remote --exit-code --heads origin sync/upstream >/dev/null; then
            git checkout -B sync/upstream origin/sync/upstream
            if ! git merge --no-edit upstream/master; then
              git merge --abort
              conflict=true
            fi
          else
            git checkout -B sync/upstream upstream/master
          fi
          git push origin sync/upstream
          echo "conflict=$conflict" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.check.outputs.uptodate != 'true'
        # gh resolves the repository from a remote named upstream before origin
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          CONFLICT: ${{ steps.sync.outputs.conflict }}
        run: |
          {
            echo "## なぜ"
            echo
            echo "本家 (opentoonz/opentoonz) の master に integration 未取り込みのコミットがある。"
            echo
            echo "## なにを"
            echo
            echo "本家 master \`$(git rev-parse --short upstream/master)\` を integration にマージする。"
            echo
            if [ "$CONFLICT" = true ]; then
              echo "> [!WARNING]"
              echo "> \`sync/upstream\` への本家 master の自動 merge が衝突した。手元で \`sync/upstream\` に本家 master をマージして解消し、push してから再実行する。"
              echo
            fi
            echo "## 取り込むコミット"
            echo
            git log --first-parent --format='- %s' origin/integration..upstream/master | head -100
            total=$(git rev-list --first-parent --count origin/integration..upstream/master)
            if [ "$total" -gt 100 ]; then
              echo "- ほか $((total - 100)) 件"
            fi
            echo
            echo "## マージ前の確認"
            echo
            echo "- [ ] 衝突がある場合は \`sync/upstream\` に integration をマージして解消する (衝突時は本家側を採用)"
            echo "- [ ] 本家にマージ済みの社内 PR があれば、そのマージコミットを先に revert する"
            echo "- [ ] Windows ビルドが通っている"
          } > body.md
          # Dated by the upstream head rather than the run, so the title (whose
          # every change is logged on the pull request) only changes when
          # upstream moves
          title="Merge upstream master as of $(TZ=Asia/Tokyo git log -1 --date=format-local:%Y-%m-%d --format=%cd upstream/master)"
          number=$(gh pr list --head sync/upstream --base integration --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            # After a conflict the branch still holds the previous upstream head
            if [ "$CONFLICT" = true ]; then
              gh pr edit "$number" --body-file body.md
            else
              gh pr edit "$number" --title "$title" --body-file body.md
            fi
          else
            gh pr create --base integration --head sync/upstream \
              --title "$title" \
              --body-file body.md
          fi
          [ "$CONFLICT" != true ]
